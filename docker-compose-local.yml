version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: recipe-provider-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: RecipesDatabase
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - recipe-provider-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  mongodb_config:

networks:
  recipe-provider-network:
    driver: bridge

