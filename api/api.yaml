openapi: 3.0.0
info:
  title: Sample API
  description: API for RecipeProvider
  version: 0.1.9
servers:
  - url: http://localhost:8080
    description: Optional server description, e.g. Main (production) server

paths:
  /recipes:
    get:
      summary: Returns a list of recipes.
      description: Returns a list of recipes.
      operationId: getRecipes
      responses:
        '200':    # status code
          description: A JSON array of recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDto'
components:
  schemas:
    RecipeDto:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          title:
            type: string
          ingredients:
            type: array
            items:
              type: string
          preparation:
            type: array
            items:
              type: string



