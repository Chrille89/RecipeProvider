openapi: 3.0.0
info:
  title: Sample API
  description: API for RecipeProvider
  version: 0.1.9
servers:
  - url: http://localhost:8080
    description: Optional server description, e.g. Main (production) server

paths:
  /recipes/all:
    get:
      summary: Return all recipes.
      description: Return all recipes.
      operationId: getAllRecipes
      responses:
        '200': # status code
          description: Return all recipe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeReadDto'
    delete:
      summary: Delete all recipes.
      description: Delete all recipes.
      operationId: deleteAllRecipes
      responses:
        '200': # status code
          description: Delete all recipes
  /recipes:
    get:
      summary: Return two random recipes
      description: Return two random recipes
      operationId: getRandomRecipes
      responses:
        '200':    # status code
          description: Return two random recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeReadDto'
    post:
      summary: Create a recipe.
      description: Create a recipe.
      operationId: createRecipe
      requestBody:
        description: Recipe in JSON format.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeWriteDto'
      responses:
        '204':
          description: callback successfully processed
components:
  schemas:
    RecipeReadDto:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        labels:
          type: array
          items:
            type: string
            enum:
              - lowcarb
              - lowfat
              - vegetarian
              - pig
              - beef
              - fish
        image:
          type: string
          format: uri
        duration:
          type: integer
          description: Duration in minutes
          example: 30
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/AmountDto'
        nutrients:
          type: array
          items:
            $ref: '#/components/schemas/AmountDto'
        preparation:
          type: array
          items:
            type: string
    RecipeWriteDto:
      type: object
      properties:
        title:
          type: string
        labels:
          type: array
          items:
            type: string
            enum:
              - lowcarb
              - lowfat
              - vegetarian
              - pig
              - beef
              - fish
        image:
          type: string
          format: uri
        duration:
          type: integer
          description: Duration in minutes
          example: 30
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/AmountDto'
        nutrients:
          type: array
          items:
            $ref: '#/components/schemas/AmountDto'
        preparation:
          type: array
          items:
            type: string
    AmountDto:
      type: object
      properties:
        name:
          type: string
        amount:
          type: integer
        unit:
          type: string
          enum:
            - gramm
            - kilogramm
            - stueck
            - milliliter
            - liter
